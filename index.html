<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="NuEra Nutraceuticals Inc." />
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Merriweather:wght@700;900&amp;display=swap" rel="stylesheet">

    
    
    <!--seo:start-->
    <title data-seo>NuEra Nutraceuticals | Advanced NHP Manufacturing &amp; Quality Systems</title>
    <meta data-seo name="description" content="Canadian nutraceutical contract manufacturing with formulation, testing, packaging, regulatory support and advanced quality-control systems for natural health products.">
    <!--seo:end-->
  </head>
  <body>
    <!-- Netlify Forms build-time detection (hidden) -->
    <form name="contact-inquiry" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact-inquiry" />
      <input type="hidden" name="locale" />
      <input name="bot-field" />
      <input type="text" name="inquiry_type" />
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="product_name" />
      <input type="text" name="product_type" />
      <input type="text" name="product_status" />
      <input type="text" name="npn_status" />
      <input type="text" name="manufacturing_situation" />
      <input type="text" name="assessment_reason" />
      <input type="text" name="development_stage" />
      <input type="text" name="estimated_volume" />
      <textarea name="message"></textarea>
    </form>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
